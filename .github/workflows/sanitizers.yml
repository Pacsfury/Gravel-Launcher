name: Sanitizers Audit

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  audit:
    runs-on: ubuntu-latest

    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1,print_stacktrace=1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install llvmlite

    - name: Compile C Code with Sanitizers
      run: gcc -std=c11 -g3 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all src/*.c -o gravel

    - name: Run test suite with Auditing
      run: python tests/tests.py

    - name: Run Fuzzer
      run: |
        cat << 'EOF' > tests/fuzz_target.c
        #include <stddef.h>
        #include <stdint.h>
        #include <stdlib.h>
        #include <setjmp.h>

        typedef struct {
            int argc;
            char **argv;
        } ARGS_CONTEX;

        void tokenize(const char* file, ARGS_CONTEX* ctx);

        jmp_buf fuzz_env;

        void __wrap_exit(int status) {
            longjmp(fuzz_env, 1); 
        }

        int LLVMFuzzerTestOneInput(const uint8_t *data, size_t size) {
            if (size < 1) return 0;

            char* safe_source = (char*)malloc(size + 1);
            for (size_t i = 0; i < size; i++) {
                safe_source[i] = (char)data[i];
            }
            safe_source[size] = '\0';

            ARGS_CONTEX ctx;
            ctx.argc = 0;
            ctx.argv = NULL;

            if (setjmp(fuzz_env) == 0) {
                tokenize(safe_source, &ctx);
            }

            free(safe_source);
            return 0;
        }
        EOF

        clang -fsanitize=fuzzer,address,undefined -Dmain=gravel_main -Wl,--wrap=exit src/*.c tests/fuzz_target.c -o fuzzer
        
        env ASAN_OPTIONS="detect_leaks=0" ./fuzzer -max_total_time=30 -close_fd_mask=3
